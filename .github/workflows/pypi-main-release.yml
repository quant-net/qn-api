# .github/workflows/pypi-main-release.yml

name: PyPI-main-manual

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Build package distributions
        run: python -m build

      - name: Publish package to PyPI using token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  test-install:
    name: Test Installation from PyPI
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read package version from source code
        id: get_version
        run: |
          VERSION=$(python -c "from api import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install package from PyPI
        run: |
          echo "Waiting 15 seconds for PyPI index to update..."
          sleep 15
          pip install "quantnet-api==${{ steps.get_version.outputs.version }}"
          echo "Successfully installed quantnet-api version ${{ steps.get_version.outputs.version }}"

      - name: Verify package installation
        run: |
          echo "Verifying installation..."
          pip show quantnet-api
