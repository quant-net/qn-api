# .github/workflows/pypi-rc.yml
#
# Publishes a PEP 440 release-candidate package to PyPI on every push
# to a v* release branch (e.g. v1.1.0 → 1.1.0rc1, 1.1.0rc2, …).
#
# The RC number is the count of commits on the branch since it diverged
# from develop, so it increments automatically with each push.

name: PyPI Release Candidate

on:
  push:
    branches:
      - 'v*'

jobs:
  build-and-publish-rc:
    name: Build and Publish RC to PyPI
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.rc_version.outputs.rc_version }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Compute RC version
        id: rc_version
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BASE_VERSION="${BRANCH_NAME#v}"

          git fetch origin develop:develop || true
          MERGE_BASE=$(git merge-base develop HEAD 2>/dev/null \
            || git rev-list --max-parents=0 HEAD)
          COMMIT_COUNT=$(git rev-list --count ${MERGE_BASE}..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then COMMIT_COUNT=1; fi

          RC_VERSION="${BASE_VERSION}rc${COMMIT_COUNT}"
          echo "rc_version=$RC_VERSION" >> $GITHUB_OUTPUT
          echo "Publishing RC version: $RC_VERSION"

      - name: Patch version in source
        run: |
          sed -i "s/__version__ = .*/__version__ = \"${{ steps.rc_version.outputs.rc_version }}\"/" \
            api/__init__.py
          echo "Patched api/__init__.py:"
          cat api/__init__.py

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  test-install:
    name: Test RC Installation
    needs: build-and-publish-rc
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RC package from PyPI
        run: |
          echo "Waiting 15 seconds for PyPI index to update..."
          sleep 15
          pip install "quantnet-api==${{ needs.build-and-publish-rc.outputs.rc_version }}"
          echo "Successfully installed quantnet-api version ${{ needs.build-and-publish-rc.outputs.rc_version }}"

      - name: Verify installation
        run: |
          echo "Verifying installation..."
          pip show quantnet-api
